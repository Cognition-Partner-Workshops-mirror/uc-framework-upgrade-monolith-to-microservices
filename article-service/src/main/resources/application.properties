# Article Service Configuration
# Standalone microservice extracted from the RealWorld monolith
server.port=8081

# SQLite database — separate from the monolith's dev.db
spring.datasource.url=jdbc:sqlite:article-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Jackson configuration — match monolith's UNWRAP_ROOT_VALUE behavior
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

# MyBatis configuration — same as monolith
mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true

# Flyway migration for article-service schema
spring.flyway.enabled=true

# Actuator health endpoint configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# User-service base URL for cross-service communication
user-service.base-url=http://localhost:8080

# Logging
logging.level.io.spring.articleservice=DEBUG
