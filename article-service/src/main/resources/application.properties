# Article microservice configuration
# Runs on port 8081 (user-service/monolith runs on 8080)
server.port=8081

# SQLite database - separate from user-service
spring.datasource.url=jdbc:sqlite:article-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Jackson configuration to match monolith API format
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

# JWT secret - must match user-service for shared token validation
jwt.secret=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA

# User-service URL for cross-service REST calls (profile data)
user-service.url=http://localhost:8080

# MyBatis configuration - mirrors monolith settings
mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.articleservice.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

# Actuator health endpoint configuration for service monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
