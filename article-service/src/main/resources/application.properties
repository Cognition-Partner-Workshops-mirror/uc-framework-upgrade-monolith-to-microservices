# Article Service — runs on port 8081 (main app on 8080)
server.port=8081
spring.application.name=article-service

# SQLite database for the article-service
spring.datasource.url=jdbc:sqlite:article-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Jackson configuration to match main app's JSON format
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

# JWT configuration (shared secret with user-service for token validation)
jwt.secret=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
jwt.sessionTime=86400

# MyBatis configuration
mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.article.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

# User-service URL for cross-service communication
user-service.url=http://localhost:8080

# Actuator health endpoints for container orchestration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.io.spring.article=DEBUG
