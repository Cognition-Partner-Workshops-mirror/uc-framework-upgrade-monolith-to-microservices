# Article service runs on port 8081
server.port=8081

spring.datasource.url=jdbc:sqlite:article-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

image.default=https://static.productionready.io/images/smiley-cyrus.jpg

# JJWT 0.12.x requires >=512-bit key for HS512 (64+ bytes); set JWT_SECRET env var in production
jwt.secret=${JWT_SECRET:changeme-this-is-a-dev-placeholder-key-that-must-be-at-least-sixty-four-bytes-long}
jwt.sessionTime=86400

# Cross-service communication: user-service base URL
user-service.url=${USER_SERVICE_URL:http://localhost:8080}

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.article.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

# Actuator health endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.io.spring.article.infrastructure.mybatis.readservice.ArticleReadService=DEBUG
logging.level.io.spring.article.infrastructure.mybatis.mapper=DEBUG
