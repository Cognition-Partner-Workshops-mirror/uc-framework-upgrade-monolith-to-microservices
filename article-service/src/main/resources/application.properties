# Article-service configuration — standalone microservice for the Article bounded context
server.port=8081

# SQLite database — separate from the monolith's database
spring.datasource.url=jdbc:sqlite:article-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Flyway migration for article-related tables
spring.flyway.enabled=true

# JWT configuration — must match user-service (monolith) secret for token validation
jwt.secret=nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-hIU7v0
jwt.sessionTime=86400

# MyBatis configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
mybatis.type-handlers-package=io.spring.articleservice.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

# User-service URL for cross-service communication (resolving user profiles)
user-service.url=http://localhost:8080

# Spring Boot Actuator — health endpoint for Docker Compose healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
