plugins {
    // Spring Boot 3.2.4 — same version as the upgraded monolith
    id 'org.springframework.boot' version '3.2.4'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
}

group = 'io.spring'
version = '0.0.1-SNAPSHOT'
// Java 17 minimum required by Spring Boot 3
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Web layer for REST controllers
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Bean validation (Jakarta EE 10)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Health check and monitoring endpoints
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // MyBatis for data persistence — same as monolith
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // Database migration
    implementation 'org.flywaydb:flyway-core'
    // SQLite JDBC driver — same as monolith
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    // Joda-Time for DateTime handling — matching monolith's date library
    implementation 'joda-time:joda-time:2.12.7'
    // JWT for validating tokens from the user-service
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5',
                'io.jsonwebtoken:jjwt-jackson:0.12.5'
    // Spring Security for JWT filter
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Lombok for boilerplate reduction
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}
