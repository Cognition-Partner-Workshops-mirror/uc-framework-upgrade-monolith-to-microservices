plugins {
    // Upgraded from Spring Boot 2.6.3 to 3.2.4 for Jakarta EE 10 and Spring Framework 6 support
    id 'org.springframework.boot' version '3.2.4'
    // Upgraded dependency management plugin to latest compatible version
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    // Upgraded DGS codegen plugin to version compatible with Spring Boot 3
    id "com.netflix.dgs.codegen" version "6.0.3"
    // Upgraded Spotless to version compatible with Java 17+
    id "com.diffplug.spotless" version "6.25.0"
    id 'jacoco'
}

version = '0.0.1-SNAPSHOT'
// Upgraded from Java 11 to Java 17 (minimum required by Spring Boot 3)
sourceCompatibility = '17'
targetCompatibility = '17'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/generated/**/*.*', 'build/generated-examples/**/*.*'
        }
        googleJavaFormat()
    }
}

jacoco {
    // Upgraded JaCoCo to support Java 17+ bytecode
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Added Actuator for health check endpoints (/actuator/health)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Upgraded MyBatis starter from 2.2.2 to 3.0.3 for Spring Boot 3 / Jakarta EE compatibility
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // Upgraded DGS starter from 4.9.21 to 7.6.0 for Spring Boot 3 compatibility
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter:7.6.0'
    implementation 'org.flywaydb:flyway-core'
    // Upgraded JJWT from 0.11.2 to 0.12.5 (new builder API for Spring Boot 3)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5',
                'io.jsonwebtoken:jjwt-jackson:0.12.5'
    // Upgraded Joda-Time to latest
    implementation 'joda-time:joda-time:2.12.7'
    // Upgraded SQLite JDBC driver to latest version
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Upgraded rest-assured from 4.x to 5.x for Jakarta EE / Spring Boot 3 compatibility
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'
    testImplementation 'io.rest-assured:xml-path:5.4.0'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.4.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Upgraded MyBatis test starter for Spring Boot 3
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    // Replaced mockito-inline 4.0.0 with mockito-core (inline mocking is default in Mockito 5+)
    testImplementation 'org.mockito:mockito-core'
    
    // Selenium E2E testing
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.2'
    testImplementation 'org.testng:testng:7.8.0'
    testImplementation 'com.aventstack:extentreports:5.1.1'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

tasks.named('test') {
	useJUnitPlatform()
	// Exclude Selenium tests from JUnit test task
	exclude 'io/spring/selenium/**'
	finalizedBy jacocoTestReport
}

// Separate task for Selenium E2E tests using TestNG
tasks.register('seleniumTest', Test) {
	description = 'Run Selenium E2E tests'
	group = 'verification'
	
	useTestNG {
		suites 'src/test/resources/selenium/testng-smoke.xml'
	}
	
	// Only include Selenium tests
	include 'io/spring/selenium/**'
	
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
	
	// Don't fail the build on test failures (for CI reporting)
	ignoreFailures = false
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
}

// Clean database before running to avoid Flyway migration conflicts
tasks.named('bootRun') {
    doFirst {
        delete './dev.db'
    }
}
