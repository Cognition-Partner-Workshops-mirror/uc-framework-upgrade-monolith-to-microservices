plugins {
    // Upgraded from Spring Boot 2.6.3 to 3.2.5 for Jakarta EE 10 and Spring Framework 6 support
    id 'org.springframework.boot' version '3.2.5'
    // Upgraded dependency-management plugin for Spring Boot 3 compatibility
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    // Upgraded DGS codegen from 5.0.6 to 6.1.0 for Spring Boot 3 / Jakarta namespace support
    id "com.netflix.dgs.codegen" version "6.1.0"
    // Upgraded spotless from 6.2.1 to 6.25.0 for Java 17 compatibility
    id "com.diffplug.spotless" version "6.25.0"
    id 'jacoco'
}

version = '0.0.1-SNAPSHOT'
// Upgraded from Java 11 to Java 17 (minimum required by Spring Boot 3)
sourceCompatibility = '17'
targetCompatibility = '17'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/generated/**/*.*', 'build/generated-examples/**/*.*'
        }
        googleJavaFormat()
    }
}

jacoco {
    // Upgraded from 0.8.7 to 0.8.11 for Java 17 bytecode support
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Upgraded from Spring Boot 3 actuator for health check endpoints
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Upgraded MyBatis starter from 2.2.2 to 3.0.3 for Spring Boot 3 / Jakarta namespace
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    // Upgraded DGS from 4.9.21 to 8.5.0 for Spring Boot 3 / Jakarta namespace support
    implementation platform('com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:8.5.0')
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter'
    implementation 'org.flywaydb:flyway-core'
    // Upgraded JJWT from 0.11.2 to 0.12.5 for Jakarta namespace compatibility
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5',
                'io.jsonwebtoken:jjwt-jackson:0.12.5'
    implementation 'joda-time:joda-time:2.12.7'
    // Upgraded SQLite JDBC driver for Java 17 compatibility
    implementation 'org.xerial:sqlite-jdbc:3.45.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Upgraded REST Assured from 4.5.1 to 5.4.0 for Jakarta namespace support
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'
    testImplementation 'io.rest-assured:xml-path:5.4.0'
    testImplementation 'io.rest-assured:spring-mock-mvc:5.4.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Upgraded MyBatis test starter for Spring Boot 3
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
    testImplementation 'org.mockito:mockito-inline:4.0.0'
    
    // Selenium E2E testing
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.2'
    testImplementation 'org.testng:testng:7.8.0'
    testImplementation 'com.aventstack:extentreports:5.1.1'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

tasks.named('test') {
	useJUnitPlatform()
	// Exclude Selenium tests from JUnit test task
	exclude 'io/spring/selenium/**'
	finalizedBy jacocoTestReport
}

// Separate task for Selenium E2E tests using TestNG
tasks.register('seleniumTest', Test) {
	description = 'Run Selenium E2E tests'
	group = 'verification'
	
	useTestNG {
		suites 'src/test/resources/selenium/testng-smoke.xml'
	}
	
	// Only include Selenium tests
	include 'io/spring/selenium/**'
	
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
	
	// Don't fail the build on test failures (for CI reporting)
	ignoreFailures = false
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

// DGS codegen task: property assignment syntax for codegen plugin 6.x
tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"]
    packageName = 'io.spring.graphql'
}

// Clean database before running to avoid Flyway migration conflicts
tasks.named('bootRun') {
    doFirst {
        delete './dev.db'
    }
}
