mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

logging.level.io.spring.infrastructure.mybatis.readservice.ArticleReadService=DEBUG
logging.level.io.spring.infrastructure.mybatis.mapper=DEBUG

# Spring Boot 3 / DGS 8 GraphQL configuration
# DGS 8 uses Spring GraphQL under the hood, so the graphql endpoint is configured here
spring.graphql.graphiql.enabled=true
# Point Spring GraphQL to the DGS schema location (default DGS location is classpath:schema/)
spring.graphql.schema.locations=classpath:schema/
# Disable Spring GraphQL schema inspection to prevent conflicts with DGS-managed connection types
# (DGS handles Relay connection types via datafetchers, not Spring GraphQL's ConnectionTypeDefinitionConfigurer)
spring.graphql.schema.inspection.enabled=false

# Actuator health endpoint configuration for monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
