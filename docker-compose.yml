# Docker Compose for RealWorld microservices
# Runs both the user-service (monolith) and the extracted article-service
version: '3.8'

services:
  # User Service — the original monolith handling users, profiles, follows
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - realworld-network

  # Article Service — extracted microservice owning articles, tags, comments, favorites
  article-service:
    build:
      context: ./article-service
      dockerfile: Dockerfile
    container_name: article-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      # Point to user-service for cross-service profile resolution
      - USER_SERVICE_BASE_URL=http://user-service:8080
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - realworld-network

networks:
  realworld-network:
    driver: bridge
